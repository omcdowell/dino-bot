# Release: build every tarball from this repo's own folders at the tag (paseo/, plugins/bots/,
# optchat/, addons/paseo-apns/; external pins in build/sources.json) on clean runners,
# checksum it, sign it keyless with Sigstore (cosign; no key exists anywhere), and publish a
# GitHub Release. install.sh and `dinobot update` refuse any tarball whose signature is not from
# THIS file at a v* tag of THIS repo (lib/signing.json), so renaming or moving this file, or
# releasing from a branch, breaks installs on purpose.
#
# Trigger: push a tag v<semver> (e.g. v0.1.0) on a reviewed commit of main.
# Secrets: none required: every source is a folder of the tagged commit (one checkout).
#          DINOBOT_PRIVATE_GUARD (optional): build/private-guard.sh's patterns.
#
# Why cosign and not GitHub artifact attestations: attestations need a public repo (or Enterprise
# Cloud) and `gh` plus a GitHub login to verify; cosign bundles work from this private repo today,
# travel as a plain release file over any download route, and verify without a GitHub account.
# When the repo goes public the attest step below also runs, so `gh attestation verify` works too.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {} # every job asks for exactly what it needs

# Credit guard (28 Oct): a second push of the same tag cancels the first run instead of queueing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: echo "node=$(jq -r .node build/sources.json)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.v.outputs.node }}
      - name: tag is a release version (v<major>.<minor>.<patch>[-x])
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-x]"; exit 1 ;; esac
          want="v$(jq -r .version lib/product.json)" # the version the install reports (MANIFEST.json, doctor)
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, but lib/product.json says $want"; exit 1; }
      - name: unit tests (incl. fail-closed checksum + signature)
        run: node --test test/unit.test.mjs test/wave2.test.mjs test/providers.test.mjs test/signing.test.mjs test/public-tree.test.mjs test/push.test.mjs

  # Linux first; macOS (10x minutes) only once test and both Linux builds have passed.
  # Private repo runners: 2 CPU / 8 GB (Linux), 3 CPU / 7 GB (macOS arm64), not the 16 GB of public
  # repos; the web UI export is capped for that (BUILD_ENV in build/ci-build.sh).
  # darwin-x64 (Intel Mac) is not built: another 10x macOS job for a platform nobody in the test has.
  build-linux:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # no id-token here: build code (npm scripts) can never sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: src
        run: echo "node=$(jq -r .node build/sources.json)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.src.outputs.node }}
      - name: macOS has shasum, not sha256sum
        if: runner.os == 'macOS'
        run: command -v sha256sum || brew install coreutils
      - name: zstd for the .tar.zst (preinstalled on GitHub's images; installed if not)
        run: command -v zstd || { if [ "$RUNNER_OS" = macOS ]; then brew install zstd; else sudo apt-get install -y zstd; fi; }
      - name: macOS, no Spotlight indexing of node_modules (npm ci took 14 min there on 28 Oct)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: build ${{ matrix.target }}
        env:
          # Patterns for build/private-guard.sh (optional repo secret: the names are not in this repo).
          DINOBOT_PRIVATE_GUARD: ${{ secrets.DINOBOT_PRIVATE_GUARD }}
        run: build/ci-build.sh "${{ matrix.target }}"
      - name: secret scan of the staged tarball
        # A real key, not a placeholder: pi's own docs carry 'sk-ant-oat01-{rand}' (preflight, 28 Oct).
        run: |
          # The .tar.zst must hold exactly the .tar.gz's files (same tree, two compressions).
          cmp <(tar -tzf "dist/dinobot-${{ matrix.target }}.tar.gz") <(zstd -dcq "dist/dinobot-${{ matrix.target }}.tar.zst" | tar -tf -)
          mkdir -p /tmp/scan && tar -xzf "dist/dinobot-${{ matrix.target }}.tar.gz" -C /tmp/scan
          if grep -rIlE 'sk-ant-(oat|api)[0-9]{2}-[A-Za-z0-9_-]{20}|sk-or-v1-[0-9a-f]{20}|ghp_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              /tmp/scan --exclude-dir=node_modules; then echo "secret-shaped string in the tarball (above)"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist/dinobot-${{ matrix.target }}.tar.gz
            dist/dinobot-${{ matrix.target }}.tar.gz.sha256
            dist/dinobot-${{ matrix.target }}.tar.zst
            dist/dinobot-${{ matrix.target }}.tar.zst.sha256
            dist/install.sh
          if-no-files-found: error
          retention-days: 1 # only the release job reads them; keeps artifact storage (Free: 500 MB) near zero

  build-macos:
    needs: [test, build-linux]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # no id-token here: build code (npm scripts) can never sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: src
        run: echo "node=$(jq -r .node build/sources.json)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.src.outputs.node }}
      - name: macOS has shasum, not sha256sum
        if: runner.os == 'macOS'
        run: command -v sha256sum || brew install coreutils
      - name: zstd for the .tar.zst (preinstalled on GitHub's images; installed if not)
        run: command -v zstd || { if [ "$RUNNER_OS" = macOS ]; then brew install zstd; else sudo apt-get install -y zstd; fi; }
      - name: macOS, no Spotlight indexing of node_modules (npm ci took 14 min there on 28 Oct)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: build ${{ matrix.target }}
        env:
          # Patterns for build/private-guard.sh (optional repo secret: the names are not in this repo).
          DINOBOT_PRIVATE_GUARD: ${{ secrets.DINOBOT_PRIVATE_GUARD }}
        run: build/ci-build.sh "${{ matrix.target }}"
      - name: secret scan of the staged tarball
        # A real key, not a placeholder: pi's own docs carry 'sk-ant-oat01-{rand}' (preflight, 28 Oct).
        run: |
          # The .tar.zst must hold exactly the .tar.gz's files (same tree, two compressions).
          cmp <(tar -tzf "dist/dinobot-${{ matrix.target }}.tar.gz") <(zstd -dcq "dist/dinobot-${{ matrix.target }}.tar.zst" | tar -tf -)
          mkdir -p /tmp/scan && tar -xzf "dist/dinobot-${{ matrix.target }}.tar.gz" -C /tmp/scan
          if grep -rIlE 'sk-ant-(oat|api)[0-9]{2}-[A-Za-z0-9_-]{20}|sk-or-v1-[0-9a-f]{20}|ghp_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              /tmp/scan --exclude-dir=node_modules; then echo "secret-shaped string in the tarball (above)"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist/dinobot-${{ matrix.target }}.tar.gz
            dist/dinobot-${{ matrix.target }}.tar.gz.sha256
            dist/dinobot-${{ matrix.target }}.tar.zst
            dist/dinobot-${{ matrix.target }}.tar.zst.sha256
            dist/install.sh
          if-no-files-found: error
          retention-days: 1 # only the release job reads them; keeps artifact storage (Free: 500 MB) near zero

  # The basic desktop app (Linux AppImage, macOS dmg), from the same pinned paseo commit
  # (build/ci-desktop.sh). Runs only once test and both Linux tarball builds have passed, like
  # build-macos (its macOS leg counts 10x). Measured cost per release: see docs/releases.md.
  desktop:
    needs: [test, build-linux]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # no id-token here: build code (npm scripts) can never sign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: src
        run: echo "node=$(jq -r .node build/sources.json)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.src.outputs.node }}
      - name: macOS has shasum, not sha256sum
        if: runner.os == 'macOS'
        run: command -v sha256sum || brew install coreutils
      - name: macOS, no Spotlight indexing of node_modules (npm ci took 14 min there on 28 Oct)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true
      - name: build the desktop app (${{ matrix.target }})
        env:
          DINOBOT_PRIVATE_GUARD: ${{ secrets.DINOBOT_PRIVATE_GUARD }}
        run: build/ci-desktop.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/DinoBot-*.AppImage
            dist/DinoBot-*.dmg
            dist/DinoBot-*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-linux, build-macos, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # An approval gate (environment: release, required reviewer) needs a public repo or GitHub Pro;
    # add it then. On Free + private it is not available.
    permissions:
      contents: write # create the release
      id-token: write # the keyless signature: GitHub's OIDC token -> Sigstore certificate
      attestations: write # only used once the repo is public (step guarded below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          echo "node=$(jq -r .node build/sources.json)" >>"$GITHUB_OUTPUT"
          echo "cosign=$(jq -r .cosign.version lib/signing.json)" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.v.outputs.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-*" # tarball-<target> and desktop-<target>
          path: out
      - name: collect, check checksums, one install.sh
        run: |
          mkdir release
          for d in out/tarball-*; do
            t=${d#out/tarball-}
            for x in tar.gz tar.zst; do
              cp "$d/dinobot-$t.$x" "$d/dinobot-$t.$x.sha256" release/
              (cd release && sha256sum -c "dinobot-$t.$x.sha256")
            done
          done
          # install.sh is stamped identically on every runner; publish one, refuse if they differ.
          # The desktop app: one AppImage and one dmg, each checked against its .sha256.
          for d in out/desktop-*; do
            for f in "$d"/DinoBot-*.AppImage "$d"/DinoBot-*.dmg; do
              [ -f "$f" ] || continue
              cp "$f" "$f.sha256" release/
              (cd release && sha256sum -c "$(basename "$f").sha256")
            done
          done
          [ "$(ls release/DinoBot-*.AppImage release/DinoBot-*.dmg | wc -l)" = 2 ] || { echo "expected one AppImage and one dmg"; exit 1; }
          set -- out/tarball-*/install.sh; first=$1
          for f in out/tarball-*/install.sh; do cmp "$first" "$f"; done
          cp "$first" release/install.sh
          node --input-type=module -e '
            import { readFileSync } from "node:fs"; import { stampSigning } from "./build/stamp-signing.mjs";
            const s = readFileSync("release/install.sh", "utf8");
            if (stampSigning(s, JSON.parse(readFileSync("lib/signing.json", "utf8"))) !== s) { console.error("install.sh is not stamped from lib/signing.json"); process.exit(1); }'
          ls -la release
      - name: the signature checker, compressed (install.sh's first download; same pinned binary)
        run: |
          targets=$(ls release | sed -n 's/^dinobot-\(.*\)\.tar\.gz$/\1/p')
          build/cosign-assets.sh release $targets
          (cd release && sha256sum dinobot-*.tar.gz dinobot-*.tar.zst cosign-*.gz cosign-*.zst install.sh DinoBot-*.AppImage DinoBot-*.dmg >SHA256SUMS)
          ls -la release
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.v.outputs.cosign }}
      - name: sign (keyless; Fulcio certificate for this workflow at this tag, logged in Rekor)
        run: |
          cd release
          for f in dinobot-*.tar.gz dinobot-*.tar.zst cosign-*.gz cosign-*.zst install.sh DinoBot-*.AppImage DinoBot-*.dmg SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: verify exactly as install.sh / dinobot update will
        run: |
          RE=$(node -e 'import("./lib/signature.mjs").then(m => console.log(m.identityRegexp()))')
          ISS=$(jq -r .issuer lib/signing.json); REPO=$(jq -r .repo lib/signing.json)
          [ "$REPO" = "$GITHUB_REPOSITORY" ] || { echo "lib/signing.json repo $REPO != $GITHUB_REPOSITORY: clients would refuse this release"; exit 1; }
          cd release
          for f in dinobot-*.tar.gz dinobot-*.tar.zst cosign-*.gz cosign-*.zst install.sh DinoBot-*.AppImage DinoBot-*.dmg SHA256SUMS; do
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "$RE" --certificate-oidc-issuer "$ISS" \
              --certificate-github-workflow-repository "$REPO"
          done
      - name: GitHub artifact attestation (public repos only; Free plan has none for private)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/dinobot-*.tar.gz
            release/dinobot-*.tar.zst
            release/DinoBot-*.AppImage
            release/DinoBot-*.dmg
      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Not marked pre-release, so releases/latest (install.sh, dinobot update) finds it.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "DinoBot $TAG" \
            --notes "Built from this repo at $GITHUB_SHA (paseo/, plugins/bots/, optchat/; pins in build/sources.json) by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Every file has a keyless Sigstore signature (.sigstore.json); install.sh and \`dinobot update\` check it." \
            release/*
